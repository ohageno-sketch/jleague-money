name: daily-update

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      finance_probe:
        description: 'run finance_probe.py only (no write)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests beautifulsoup4 pdfplumber

      - name: Run updater
        if: ${{ github.event.inputs.finance_probe != 'true' }}
        run: python update.py

      - name: Run finance probe
        if: ${{ github.event.inputs.finance_probe == 'true' }}
        run: python finance_probe.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "auto update ${{ github.run_id }}"
            git push
          fi
